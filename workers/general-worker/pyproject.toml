[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "etsy-automation-worker"
version = "0.1.0"
description = "Dramatiq background worker for the Etsy PNG automation platform."
requires-python = ">=3.12"
# The worker reuses the API's domain, ports and settings. It is installed from
# the local path in development (see scripts/dev-setup.sh) rather than published.
dependencies = []  # installed alongside etsy-automation-api; see scripts/dev-setup.sh

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.1",
    "mypy==2.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["worker*"]

[tool.setuptools.package-data]
worker = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "S105",
    "S106",
    "S311",
    "S110",
    "S112",
    "SIM102",
    "SIM105",
    "SIM108",
    "RUF005",
    "RUF046",
    "RUF059",
    "B007",
    "B008",
    "B904",
    "B905",
    "N806",
    "F841",
    "RUF100",
    "E402",
]





[tool.ruff.lint.isort]
# The worker imports the API package from the same repository.
known-first-party = ["worker", "app"]

[tool.mypy]
python_version = "3.12"
mypy_path = ".,../../backend"
packages = ["worker"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unreachable = false

[[tool.mypy.overrides]]
module = ["dramatiq.*", "structlog.*", "fastapi.*", "pydantic.*", "redis.*", "httpx.*", "boto3.*", "PIL.*", "pytest.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
