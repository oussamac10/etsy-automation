[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "etsy-automation-api"
version = "0.1.0"
description = "FastAPI service for the Etsy PNG automation platform."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    # Required by SQLAlchemy's asyncio bridge; not pulled in automatically on
    # every platform, so it is pinned explicitly.
    "greenlet==3.5.4",
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "psycopg[binary]==3.3.4",
    "redis==8.1.0",
    "dramatiq[redis]==2.2.0",
    "httpx==0.28.1",
    "cryptography==50.0.0",
    # Argon2id password hashing (ADR-0002). The reference implementation; there
    # is no Argon2 in the standard library and hashlib's scrypt is not the
    # algorithm the ADR chose.
    "argon2-cffi==25.1.0",
    "structlog==26.1.0",
    "python-dotenv==1.2.2",
    "boto3==1.43.71",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
    "mypy==2.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
# Ships the inline type information the worker depends on.
app = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "ASYNC",     # async correctness
    "S",         # bandit security rules
    "RUF",
]
ignore = [
    "S101",  # assert is expected in pytest
]

[tool.ruff.lint.per-file-ignores]
# Placeholder secrets in fixtures; stubs mirror third-party signatures.
"tests/**" = ["S105", "S106", "ASYNC109"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]
# The worker source is on the path so the integration test that drives its
# research actor is type-checked against the real signatures.
mypy_path = ".:../workers/general-worker"
packages = ["app"]

[[tool.mypy.overrides]]
module = ["dramatiq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires PostgreSQL, Redis or MinIO",
    "paid: calls a paid provider; requires PAID_SMOKE_TEST_ENABLED=true",
]
filterwarnings = ["error::DeprecationWarning:app.*"]
