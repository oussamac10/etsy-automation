[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "etsy-automation-api"
version = "0.1.0"
description = "FastAPI service for the Etsy PNG automation platform."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    # Required by SQLAlchemy's asyncio bridge; not pulled in automatically on
    # every platform, so it is pinned explicitly.
    "greenlet==3.5.4",
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "psycopg[binary]==3.3.4",
    "redis==8.1.0",
    "dramatiq[redis]==2.2.0",
    "httpx==0.28.1",
    "cryptography==50.0.0",
    # Argon2id password hashing (ADR-0002). The reference implementation; there
    # is no Argon2 in the standard library and hashlib's scrypt is not the
    # algorithm the ADR chose.
    "argon2-cffi==25.1.0",
    "structlog==26.1.0",
    "python-dotenv==1.2.2",
    "boto3==1.43.71",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
    "mypy==2.3.0",
    "pymupdf>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
# Ships the inline type information the worker depends on.
app = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "ASYNC",     # async correctness
    "S",         # bandit security rules
    "RUF",
]
ignore = [
    "S101",   # assert is expected in pytest
    "E501",   # line length handled by ruff format
    "RUF001", # ambiguous unicode in test assertions, mock data, and prompt text
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "S105",   # token_type = "Bearer", URL constants are not hardcoded passwords
    "S106",   # token_type="Bearer" keyword argument
    "S311",   # pseudo-random generator used for network retry jitter
    "S110",   # try-except-pass used for optional contextual resolution
    "S112",   # try-except-continue used in candidate parsing loops
    "SIM102", # nested if readability preference
    "SIM105", # try-except-pass vs contextlib.suppress
    "SIM108", # ternary operator preference
    "RUF005", # list concatenation vs unpacking
    "RUF046", # int cast after round
    "RUF059", # unused unpacked variables
    "B008",   # FastAPI Depends/Query in function parameter defaults
    "B904",   # raise ... from err in HTTP exception handling
    "B905",   # zip() without strict
    "N806",   # uppercase local constant
    "F841",   # local variable assigned but unused
    "RUF100", # unused noqa directive
    "E402",   # module level imports after setup
]



[tool.ruff.lint.per-file-ignores]
# Placeholder secrets in fixtures; stubs mirror third-party signatures.
"tests/**" = ["S105", "S106", "ASYNC109", "RUF059", "RUF043", "SIM105", "S110", "F821", "B007"]
"scripts/**" = ["E402", "S314", "B007", "SIM102", "S112", "ASYNC240", "SIM105", "S110"]



[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = ".:../workers/general-worker"
packages = ["app"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unreachable = false

[[tool.mypy.overrides]]
module = ["dramatiq.*", "structlog.*", "fastapi.*", "pydantic.*", "greenlet.*", "asyncpg.*", "psycopg.*", "redis.*", "httpx.*", "cryptography.*", "argon2.*", "boto3.*", "PIL.*", "pymupdf.*", "pytest.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires PostgreSQL, Redis or MinIO",
    "paid: calls a paid provider; requires PAID_SMOKE_TEST_ENABLED=true",
]
filterwarnings = ["error::DeprecationWarning:app.*"]
