# Local development environment.
#
# One command starts everything:  docker compose up -d --build
# No paid API key is needed: PROVIDER_MODE stays "fake".
#
# Every service declares a health check, and dependants wait for it, so
# `docker compose up` either reaches a working stack or fails visibly.

name: etsy-automation

x-python-env: &python-env
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-key-change-me}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-only-insecure-encryption-key-change-me}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-etsy}:${POSTGRES_PASSWORD:-etsy_local_password}@postgres:5432/${POSTGRES_DB:-etsy_automation}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  S3_BUCKET: ${S3_BUCKET:-etsy-assets}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
  IMAGE_WORKER_URL: http://image-worker:8100
  PROVIDER_MODE: ${PROVIDER_MODE:-fake}
  RECRAFT_API_KEY: ${RECRAFT_API_KEY:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3300}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  ETSY_API_KEY: ${ETSY_API_KEY:-${ETSY_CLIENT_ID:-}}
  ETSY_CLIENT_ID: ${ETSY_CLIENT_ID:-${ETSY_API_KEY:-}}
  ETSY_SHARED_SECRET: ${ETSY_SHARED_SECRET:-${ETSY_CLIENT_SECRET:-}}
  ETSY_REDIRECT_URI: ${ETSY_REDIRECT_URI:-http://localhost:8800/api/v1/auth/etsy/callback}
  ETSY_FRONTEND_REDIRECT_URL: ${ETSY_FRONTEND_REDIRECT_URL:-http://localhost:3300/settings}
  PYTHONPATH: /srv/backend:/srv/workers/general-worker

services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etsy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etsy_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-etsy_automation}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etsy} -d ${POSTGRES_DB:-etsy_automation}" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7.4-bookworm
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Creates the asset bucket, then exits. Not a long-running service.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-etsy-assets}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        echo "bucket $$S3_BUCKET ready"
    restart: "no"

  image-worker:
    build:
      context: .
      dockerfile: workers/image-worker/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379/0
      IMAGE_WORKER_PORT: "8100"
    ports:
      - "${IMAGE_WORKER_PORT:-8100}:8100"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8100/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Migrations run as an explicit release job, never implicitly on API startup.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /srv/backend
    environment:
      <<: *python-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-etsy}:${POSTGRES_PASSWORD:-etsy_local_password}@postgres:5432/${POSTGRES_DB:-etsy_automation}
    command: [ "alembic", "upgrade", "head" ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *python-env
    volumes:
      - ./backend/app:/srv/backend/app
      - ./workers/general-worker/worker:/srv/workers/general-worker/worker
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      image-worker:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: workers/general-worker/Dockerfile
    environment: *python-env
    volumes:
      - ./backend/app:/srv/backend/app
      - ./workers/general-worker/worker:/srv/workers/general-worker/worker
    command: [ "dramatiq", "worker.main", "--processes", "1", "--threads", "4" ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "python", "-m", "worker.healthcheck" ]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s

  telegram-bot:
    build:
      context: .
      dockerfile: workers/general-worker/Dockerfile
    environment: *python-env
    command: [ "python", "-m", "worker.telegram_poller" ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/srv/frontend
      - ./packages/domain:/srv/packages/domain
      - /srv/frontend/.nuxt
      - /srv/node_modules
      - /srv/frontend/node_modules
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:3000/" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

volumes:
  postgres-data:
  redis-data:
  minio-data:
